name: Mail Blast Security Analysis

on:
  push:
    branches:
      - main
      - "ci/**"
      - "security/**"
    tags:
      - "1.*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: mailblast-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  glpi-static-analysis:
    name: GLPI-aware validation — GLPI ${{ matrix.glpi_line }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - glpi_branch: "11.0/bugfixes"
            glpi_line: "11.x"
            php: "8.2"
          - glpi_branch: "12.0/bugfixes"
            glpi_line: "12.x"
            php: "8.3"

    steps:
      # PR source is inspected only in an unprivileged pull_request job.
      - name: Checkout plugin source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Follow the maintained release branches so every run tests the latest 11.x/12.x fixes.
      - name: Checkout GLPI ${{ matrix.glpi_line }} (maintenance branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: glpi-project/glpi
          ref: ${{ matrix.glpi_branch }}
          path: glpi
          persist-credentials: false

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, dom, fileinfo, gd, intl, ldap, mbstring, mysqli, sodium, xml, xmlwriter, zip
          tools: composer:v2
          coverage: none

      - name: Install GLPI development analysis tools
        working-directory: glpi
        run: |
          composer install \
            --no-interaction \
            --prefer-dist \
            --no-progress \
            --ignore-platform-req=php+ \
            --no-scripts

      - name: Generate GLPI 12 font assets
        if: matrix.glpi_line == '12.x'
        working-directory: glpi
        run: bash tools/build_fonts.sh

      - name: Prepare plugin analysis workspace
        run: |
          mkdir -p glpi/plugins/mailblast
          cp -a setup.php hook.php src templates locales js plugin.xml glpi/plugins/mailblast/

      - name: Verify GLPI API compatibility
        run: php tests/validate-glpi.php "$GITHUB_WORKSPACE/glpi" "$GITHUB_WORKSPACE/glpi/plugins/mailblast"

      - name: Verify plugin PSR-4 namespace and class-to-file mapping
        run: php tests/check-psr4.php "$GITHUB_WORKSPACE/glpi/plugins/mailblast/src" 'GlpiPlugin\Mailblast'

      - name: PHP lint with deprecated-syntax detection
        working-directory: glpi
        run: |
          vendor/bin/parallel-lint \
            --show-deprecated \
            --colors \
            plugins/mailblast/setup.php \
            plugins/mailblast/hook.php \
            plugins/mailblast/src

      - name: PHP-CS-Fixer full-source baseline (diagnostic)
        continue-on-error: true
        env:
          PLUGIN_SOURCE_ROOT: ${{ github.workspace }}
        run: |
          glpi/vendor/bin/php-cs-fixer check \
            --config="$GITHUB_WORKSPACE/.github/php-cs-fixer-plugin.php" \
            --using-cache=no \
            --diff

      - name: Enforce PHP-CS-Fixer on changed PHP files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PLUGIN_SOURCE_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mapfile -t changed_php < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" \
              | grep -E '^(setup\\.php|hook\\.php|src/.+\\.php)$' || true
          )
          if [[ ${#changed_php[@]} -eq 0 ]]; then
            echo "No changed PHP files; style gate is not applicable."
            exit 0
          fi
          glpi/vendor/bin/php-cs-fixer check \
            --config="$GITHUB_WORKSPACE/.github/php-cs-fixer-plugin.php" \
            --path-mode=intersection \
            --using-cache=no \
            --diff \
            "${changed_php[@]}"

      - name: TwigCS full-template baseline (diagnostic)
        continue-on-error: true
        working-directory: glpi
        run: |
          vendor/bin/twigcs \
            --ansi \
            --no-interaction \
            --ruleset='Glpi\\Tools\\GlpiTwigRuleset' \
            plugins/mailblast/templates

      - name: Enforce TwigCS on changed templates
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        working-directory: glpi
        run: |
          set -euo pipefail
          mapfile -t changed_twig < <(
            git -C "$GITHUB_WORKSPACE" diff --name-only --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" \
              | grep -E '^templates/.+\\.twig$' \
              | sed 's#^#plugins/mailblast/#' || true
          )
          if [[ ${#changed_twig[@]} -eq 0 ]]; then
            echo "No changed Twig templates; TwigCS gate is not applicable."
            exit 0
          fi
          vendor/bin/twigcs \
            --ansi \
            --no-interaction \
            --ruleset='Glpi\\Tools\\GlpiTwigRuleset' \
            "${changed_twig[@]}"

      - name: PHPStan with GLPI source context (diagnostic baseline)
        continue-on-error: true
        working-directory: glpi
        run: |
          vendor/bin/phpstan analyse \
            --configuration="$GITHUB_WORKSPACE/.github/phpstan-mailblast.neon" \
            --no-progress \
            --error-format=table \
            --memory-limit=1G

      - name: Psalm security and taint analysis (diagnostic baseline)
        continue-on-error: true
        run: |
          glpi/vendor/bin/psalm \
            --config="$GITHUB_WORKSPACE/.github/psalm-mailblast.xml" \
            --long-progress \
            --output-format=console
